name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Core tests
        run: swift test --package-path Packages/OmokCore

      - name: Build app for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ReverseOmok.xcodeproj \
            -scheme ReverseOmok \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
