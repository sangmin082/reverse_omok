# XcodeGen 설정 (예비용). 커밋된 ReverseOmok.xcodeproj가 열리지 않을 때:
#   brew install xcodegen && xcodegen
name: ReverseOmok
options:
  bundleIdPrefix: com.sangmin082
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
packages:
  OmokCore:
    path: Packages/OmokCore
targets:
  ReverseOmok:
    type: application
    platform: iOS
    sources:
      - App/ReverseOmok
    dependencies:
      - package: OmokCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reverseomok.game
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 리버스 오목
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.board-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
